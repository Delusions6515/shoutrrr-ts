name: CI
on: 
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [22, 24] }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@${{ matrix.node }}
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
